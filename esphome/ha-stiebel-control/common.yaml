    then:
      - lambda: |-
          ESP_LOGI("MQTT_CMD", "Received KUEHLZEIT command: %s", x.c_str());
          publishWritableTextDiscoveryByName("KUEHLZEIT", cm_kessel);
          const char* value = x.c_str();
          writeSignal(&CanMembers[cm_kessel], "KUEHLZEIT", value);
          readSignal(&CanMembers[cm_kessel], "KUEHLZEIT");

  - id: set_KESSEL_LEISTUNG_KUEHLEN
    mode: queued
    parameters:
      x: string
    then:
      - lambda: |-
          ESP_LOGI("MQTT_CMD", "Received LEISTUNG_KUEHLEN command: %s", x.c_str());
          publishWritableNumberDiscoveryByName("LEISTUNG_KUEHLEN", cm_kessel);
          const char* value = x.c_str();
          writeSignal(&CanMembers[cm_kessel], "LEISTUNG_KUEHLEN", value);
          readSignal(&CanMembers[cm_kessel], "LEISTUNG_KUEHLEN");

#########################################
#                                       #
#   INTERVAL TIMER                      #
#                                       #
#########################################
interval:
  # Process signal requests based on request table (runs every 250 ms, max. MAX_REQUESTS_PER_ITERATION request each)
  - interval: 250ms
    then:
      - lambda: |-
          processSignalRequests();
          runSignalProbe();

  # Process calculated sensor updates (runs every second)
  - interval: 1s
    then:
      - lambda: |-
          runWritableDiscoveryPump();
          processCalculatedSensors();
          if (selfHealRebootRequested()) {
            ESP_LOGE("SELF_HEAL", "Rebooting (self healing)");
            App.safe_reboot();
          }

  # Republish MQTT discovery every 15 minutes for reliability
  - interval: 15min
    then:
      - lambda: |-
          republishAllDiscoveries();
          startWritableDiscoveryPump(true);

