sensor:
  # SG Ready boost temperature sensors
  - platform: template
    name: "SG Ready Boost State 3"
    id: sg_ready_boost_state3_sensor
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 1
    icon: "mdi:thermometer-plus"
    update_interval: 30s
    lambda: |-
      return sgReadyBoostState3Value();

  - platform: template
    name: "SG Ready Boost State 4"
    id: sg_ready_boost_state4_sensor
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 1
    icon: "mdi:thermometer-plus"
    update_interval: 30s
    lambda: |-
      return sgReadyBoostState4Value();

  # WiFi and system sensors
  - platform: wifi_signal
    name: "WiFi Signal dBm"
    icon: "mdi:wifi"
    update_interval: 60s
    id: wifi_dbm

  - platform: template
    name: "WiFi Signal"
    icon: "mdi:signal"
    unit_of_measurement: "%"
    update_interval: 60s
    id: wifi_percentage
    lambda: |-
      float dBm = id(wifi_dbm).state;
      float MIN_DBM = -100.0; // Minimum RSSI in dBm
      float MAX_DBM = -30.0; // Maximum RSSI in dBm
      if (dBm < MIN_DBM) dBm = MIN_DBM;
      if (dBm > MAX_DBM) dBm = MAX_DBM;
      return ((dBm - MIN_DBM) / (MAX_DBM - MIN_DBM)) * 100;

  # Compressor starts (VERDICHTERSTARTS1000 * 1000 + VERDICHTERSTARTS1) are calculated in C++
  # and published via MQTT on the KESSEL device (heatingpump/KESSEL/VERDICHTERSTARTS_GESAMT/state).


