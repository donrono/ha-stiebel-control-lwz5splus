esphome:
  name: heatingpump
  friendly_name: "Stiebel Eltron LWZ5 CAN Interface"
  project:
    name: "bullitt186.ha-stiebel-control"
    version: "2.1.1_mod_ron"
  on_boot:
    priority: 600
    then:
      - lambda: |-
          initBoostStatePrefs();
          loadBoostState();
  includes:
    - ha-stiebel-control/elster/ElsterTable.h
    - ha-stiebel-control/elster/KElsterTable.h
    - ha-stiebel-control/elster/KElsterTable.cpp
    - ha-stiebel-control/elster/NUtils.h
    - ha-stiebel-control/elster/NUtils.cpp
    - ha-stiebel-control/elster/NTypes.h
    - ha-stiebel-control/config.h
    - ha-stiebel-control/language_select.h
    - ha-stiebel-control/lang_en.h
    - ha-stiebel-control/lang_base.h
    - ha-stiebel-control/sg_ready_controller.h
    - ha-stiebel-control/ha-stiebel-control.h
    # model-specific signal_requests_*.h is declared by each model yaml package
  build_flags:
    - "-DHA_DEVICE_MODEL=${device_model}"
    - "-DHA_LANGUAGE_${language}"
    - "-DHA_CAN_ID_PC=${can_id_pc}"     # CAN id of the ESP (PC role), same value as the canbus can_id


#########################################
#                                       #
#   LOGGER                              #
#                                       #
#########################################
logger:
  level: INFO
  baud_rate: 115200
  logs:
    canbus: INFO
    stiebel_eltron: INFO
    mqtt.component: WARN
    mqtt.client: WARN

# Real time (for the heat pump clock check of the availability sensor).
# SNTP works without Home Assistant; the homeassistant platform additionally syncs over the API.
# Both set the system clock, id(time_source).now() returns the same time either way.
time:
  - platform: sntp
    id: time_source
    timezone: Europe/Berlin
  - platform: homeassistant
    id: ha_time_sync

#########################################
#                                       #
#   API & OTA                           #
#                                       #
#########################################
api:
  reboot_timeout: 15min
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  # Uploads are authenticated and encrypted with the API encryption key (api: encryption: key)
  encryption:

safe_mode:
  reboot_timeout: 5min

#########################################
#                                       #
#   MQTT                                #
#                                       #
#########################################
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  id: mqtt_client
  # Disable native ESPHome discovery - using custom auto-discovery instead
  discovery: false
  discovery_prefix: homeassistant
  # Birth message - sent when ESP32 connects
  birth_message:
    topic: heatingpump/status
    payload: online
    qos: 1
    retain: true
  # Last Will Testament - sent by broker if ESP32 disconnects unexpectedly
  will_message:
    topic: heatingpump/status
    payload: offline
    qos: 1
    retain: true
  # Keepalive for connection monitoring
  keepalive: 15s
  # Disable reboot on MQTT disconnect - will keep trying to reconnect indefinitely
  reboot_timeout: 0s
  on_connect:
    - logger.log:
        level: INFO
        format: "Connected to MQTT broker"
        tag: "MQTT_CONN"
    - lambda: |-
        // One wildcard subscription for all ".../set" command topics (one subscription per topic
        // overflowed the MQTT event queue at connect). Each topic keeps its own handler script.
        static bool commandSubscriptionDone = false;
        if (!commandSubscriptionDone) {
          commandSubscriptionDone = true;
          // Plain array (const char* + script pointer): a std::map initializer list put all ~250
          // std::string pairs on the loop task stack at once and overflowed it (crash at MQTT connect).
          struct CommandHandler { const char *topic; esphome::script::Script<std::string> *script; };
          static const CommandHandler commandHandlers[] = {
            {"heatingpump/KESSEL/PROGRAMMSCHALTER/set", id(set_KESSEL_PROGRAMMSCHALTER)},
            {"heatingpump/KESSEL/SG_READY_STATE/set", id(set_KESSEL_SG_READY_STATE)},
            {"heatingpump/KESSEL/SG_READY_BOOST_STATE3/set", id(set_KESSEL_SG_READY_BOOST_STATE3)},
            {"heatingpump/KESSEL/SG_READY_BOOST_STATE4/set", id(set_KESSEL_SG_READY_BOOST_STATE4)},
